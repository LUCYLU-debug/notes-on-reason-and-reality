site_name: Notes on Reason & Reality
site_description: A growing collection of ideas, questions, and discoveries across disciplines.
site_url: https://lucylu-debug.github.io/notes-on-reason-and-reality/
repo_url: https://github.com/LUCYLU-debug/notes-on-reason-and-reality
repo_name: LUCYLU-debug/notes-on-reason-and-reality
site_author: Notes on Reason & Reality

theme:
  name: material
  language: en
  favicon: assets/images/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: deep purple
      accent: deep orange
  font:
    text: DM Sans
    code: Roboto Mono

nav:
  - Home: index.md
  - Reading Map: learning-path.md
  - Part I · Reason & Knowledge:
      - Reasoning, Evidence & Knowledge: part-i-reason-and-knowledge/reasoning-evidence-knowledge.md
  - Part II · Formal Limits:
      - Paradoxes & Incompleteness: part-ii-limits-of-formal-thought/paradoxes-and-formal-limits.md
  - Part III · Physical Reality:
      - Relativity & the Structure of Time: part-iii-physical-reality/relativity-and-time.md
      - Entropy & the Arrow of Time: part-iii-physical-reality/entropy-and-the-arrow-of-time.md
  - Part IV · Mind & Agency:
      - Attention, Energy & the Ordinary Day: part-iv-mind-and-agency/attention-energy-and-the-ordinary-day.md
      - Identity, Acceptance & Change: part-iv-mind-and-agency/identity-acceptance-and-change.md
  - Part V · Intelligence & Judgement:
      - Thinking With AI Without Giving Up Judgement: part-v-intelligence-and-judgement/ai-and-independent-thought.md
  - Part VI · Freedom & Meaning:
      - Compounding, Risk & Financial Freedom: part-vi-freedom-and-meaning/compounding-risk-and-financial-freedom.md
      - Meaning & the Ordinary Life: part-vi-freedom-and-meaning/meaning-and-the-ordinary-life.md
  - About: about.md

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
